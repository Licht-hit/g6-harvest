<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#245c3a">
    <meta name="description" content="Fresh Harvest, Fresh Choices. Manage farm operations and shop fresh produce with Harvest.">
    <title>Harvest | Fresh Harvest, Fresh Choices</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
<header class="site-header">
    <a class="brand" href="/" aria-label="Harvest home" data-page="home">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
                <path d="M25.8 5.2C16 5.5 8.3 8.8 8.3 17.1c0 3.2 2.2 5.4 5.1 5.4 8.8 0 11.6-8.8 12.4-17.3Z" fill="currentColor"/>
                <path d="M5.2 27c4.6-7.5 9.2-11 16.3-15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </span>
        <span>Harvest<span class="brand-period">.</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
        <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="primary-navigation" aria-label="Main navigation"></nav>
    <div class="guest-nav" id="guest-navigation">
        <a href="?page=login" data-page="login">Log in</a>
        <a class="guest-register" href="?page=register" data-page="register">Create account</a>
    </div>
    <details class="account-menu" id="account-menu" hidden>
        <summary>
            <span class="account-avatar" id="account-avatar"></span>
            <span class="account-copy">
                <strong id="account-name"></strong>
                <small id="account-role"></small>
            </span>
            <span class="account-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="account-dropdown">
            <div class="account-dropdown-user">
                <strong id="account-dropdown-name"></strong>
                <small id="account-email"></small>
                <small id="account-dropdown-role"></small>
            </div>
            <button class="account-logout" type="button" id="logout-button">↪ Log out</button>
        </div>
    </details>
</header>
<main class="container">
    <div class="notice" id="app-notice" role="status" hidden></div>
    <div id="app" aria-live="polite"></div>
</main>
<footer class="site-footer" id="site-footer">
    <p>&copy; <span id="current-year"></span> Harvest. Farm operations and produce sales.</p>
</footer>
</body>
</html>
